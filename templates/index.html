<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charging Station Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .map-container {
            height: 600px;
            width: 100%;
        }
        .map-frame {
            height: 100%;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">EV Charging Station Predictor</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Search Stations</h5>
                        <div class="input-group mb-3">
                            <input type="text" id="searchInput" class="form-control" placeholder="Enter city, state, or station name">
                            <button class="btn btn-primary" onclick="searchStations()">Search</button>
                        </div>
                        <div id="searchResults" class="list-group">
                            <!-- Search results will be populated here -->
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Predict Chargers</h5>
                        <div class="mb-3">
                            <label class="form-label">State</label>
                            <select id="stateSelect" class="form-select" onchange="loadCities()">
                                <option value="">Select a state...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">City</label>
                            <select id="citySelect" class="form-select" disabled>
                                <option value="">Select a city...</option>
                            </select>
                        </div>
                        <button class="btn btn-primary" onclick="predict()">Predict</button>
                        <div id="prediction" class="mt-3">
                            <!-- Prediction results will be shown here -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Station Map</h5>
                        <div class="map-container">
                            <iframe class="map-frame" src="{{ url_for('static', filename='map.html') }}"></iframe>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
