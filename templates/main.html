<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charging Station Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #111;
            color: #00ff41;
            font-family: 'Fira Mono', 'Consolas', 'Menlo', 'Monaco', monospace;
            min-height: 100vh;
        }
        .container {
            background: rgba(20, 20, 20, 0.97);
            border-radius: 12px;
            box-shadow: 0 0 24px #00ff4160;
            padding: 2.5rem 2rem 2rem 2rem;
            margin-top: 3rem;
        }
        h1, .lead, label, .form-label, .card-title, .form-select, .form-control, .btn, .alert, small {
            color: #00ff41 !important;
        }
        .form-control, .form-select {
            background: #222;
            border: 1px solid #00ff41;
            color: #00ff41;
        }
        .form-control:focus, .form-select:focus {
            background: #111;
            color: #00ff41;
            border-color: #00ff41;
            box-shadow: 0 0 0 0.2rem #00ff4180;
        }
        .btn-primary {
            background: #111;
            border: 1px solid #00ff41;
            color: #00ff41;
            font-weight: bold;
            letter-spacing: 1px;
            transition: background 0.2s, color 0.2s;
        }
        .btn-primary:hover, .btn-primary:focus {
            background: #00ff41;
            color: #111;
            border: 1px solid #00ff41;
        }
        .img-fluid {
            border: 2px solid #00ff41;
            border-radius: 8px;
            margin-top: 1.5rem;
            background: #222;
        }
        .alert-danger, .alert-warning, .alert-success {
            background: #222 !important;
            color: #00ff41 !important;
            border: 1px solid #00ff41 !important;
        }
        hr {
            border-top: 1px solid #00ff41;
        }
        small {
            color: #00ff41 !important;
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1 class="display-4 mb-3">Data Miner</h1>
        <p class="lead mb-4">Upload your dataset and select a graph.</p>
        <form id="processForm" method="POST" enctype="multipart/form-data" action="/process">
            <div class="row justify-content-center mb-3">
                <div class="col-md-6">
                    <label for="csv_file" class="form-label">Upload CSV File</label>
                    <input type="file" class="form-control" id="csv_file" name="csv_file" accept=".csv" required>
                </div>
            </div>
            <div class="row justify-content-center mb-3">
                <div class="col-md-6">
                    <label for="graph_type" class="form-label">Select Graph/Chart</label>
                    <select class="form-select" id="graph_type" name="graph_type" required>
                        <option value="correlation_heatmap">Correlation Heatmap</option>
                        <option value="kmeans_clustering">K-Means Clustering</option>
                        <option value="dbscan_clustering">DBSCAN Clustering</option>
                        <option value="birch_clustering">BIRCH Clustering</option>
                        <option value="pie_top5_stations">Top 5 States by Charging Stations (Pie Chart)</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Show Graph</button>
        </form>
        <div class="mt-5" id="chart-result"></div>
        <script>
        document.getElementById('processForm').onsubmit = async function(e) {
            e.preventDefault();
            const form = document.getElementById('processForm');
            const formData = new FormData(form);
            document.getElementById('chart-result').innerHTML = '<div class="text-muted">Processing...</div>';
            const response = await fetch('/process', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (data.chart_url) {
                document.getElementById('chart-result').innerHTML = `<img src="${data.chart_url}" class="img-fluid" alt="Generated Chart">`;
            } else if (data.error) {
                document.getElementById('chart-result').innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
            } else {
                document.getElementById('chart-result').innerHTML = '<div class="alert alert-warning">Unknown error.</div>';
            }
        };
        </script>
        <footer class="mt-5 text-muted">
            <hr>
            <small>Created by Joseph and Jordan - Data Mining</small>
        </footer>
    </div>
</body>
</html>
